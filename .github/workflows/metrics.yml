name: Metrics

on:
  schedule:
    # Se ejecuta una vez al día a las 00:00 UTC. Cambia el cron si quieres otra frecuencia.
    - cron: "0 0 * * *"
  # Te permite lanzarlo manualmente desde la pestaña "Actions" de tu repo
  workflow_dispatch:
  # También corre cada vez que haces push a main
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          # --- Stats + top languages (reemplaza github-readme-stats) ---
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          # --- Logros/trofeos (reemplaza github-profile-trophy) ---
          plugin_achievements: yes
          plugin_achievements_display: compact
          # --- Hábitos de commits (reemplaza streak-stats, que ya no funciona) ---
          plugin_habits: yes
          plugin_habits_charts_type: graph
          config_timezone: America/Mexico_City
